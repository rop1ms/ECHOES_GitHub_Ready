# Проверка каждого пуша и pull request: код (ruff) и все тесты qa/ на Windows — до того, как обновление
# дойдёт до людей. Логи упавших тестов — в артефакте qa-logs.
name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  tests:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ECHOES_CI: "1"
      ECHOES_NO_GH_UPDATE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            setup/constraints.txt
      - name: VLC и ffmpeg
        run: choco install vlc ffmpeg -y --no-progress
      - name: Библиотеки Python (как у пользователей)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          $c = if (Test-Path setup/constraints.txt) { @('-c', 'setup/constraints.txt') } else { @() }
          python -m pip install --prefer-binary -r app/requirements.txt @c
      - name: Тесты
        run: python qa/run_all.py --out qa-logs --timeout 900
      - name: Логи тестов
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-logs
          path: qa-logs
          retention-days: 14
