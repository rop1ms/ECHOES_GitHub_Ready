# Проверка кода ECHOES (CI и локально: py -m ruff check .)
# Только правила, которые ловят настоящие ошибки: неопределённые имена (NameError при нажатии кнопки),
# синтаксис, сравнение с литералом через is, неверный формат и т. п. Стиль кода не проверяем — у проекта свой.
target-version = "py312"
extend-exclude = ["python", "tools/launcher-build", "docs"]

[lint]
select = ["E9", "F63", "F7", "F82", "F50", "F52"]

[lint.per-file-ignores]
# скрипты qa/ берут общую заготовку из ui_smoke.py через exec — её имена ruff не видит
"qa/*" = ["F821"]
